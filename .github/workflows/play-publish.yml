# Constrói o TWA e envia para a Google Play pela API, sem passar pelo console.
#
# Depende de três coisas que só existem depois de você criar o app no console:
#   1. o app io.github.wevertonlink.neurolab existente na sua conta
#   2. a service account play-store-deploy@mindinline.iam.gserviceaccount.com
#      com acesso concedido a esse app (Usuários e permissões)
#   3. o segredo PLAY_STORE_JSON_KEY neste repositório
#
# O primeiro envio de um app novo a Play recusa pela API em algumas contas:
# ela quer o primeiro pacote pelo console. Se acontecer, suba o .aab uma vez à
# mão e todos os envios seguintes passam a funcionar por aqui.

name: Play · publicar

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Faixa de destino'
        required: true
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]
      version_name:
        description: 'Versão visível na loja (ex.: 1.0.0)'
        required: true
        default: '1.0.0'
      dry_run:
        description: 'Só validar, sem publicar de fato'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

jobs:
  publicar:
    name: Build e envio
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Ruby e Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Instala o Fastlane
        run: gem install fastlane --no-document

      - name: Credencial da Play
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -z "$PLAY_STORE_JSON_KEY" ]; then
            echo "::error::Falta o segredo PLAY_STORE_JSON_KEY neste repositório."
            exit 1
          fi
          echo "$PLAY_STORE_JSON_KEY" > "$RUNNER_TEMP/play-credentials.json"
          echo "PLAY_CREDENTIALS_PATH=$RUNNER_TEMP/play-credentials.json" >> "$GITHUB_ENV"

      # Um versionCode menor ou igual ao que já está na loja é recusado, e a
      # mensagem da API não deixa claro o motivo. Perguntar antes evita a
      # viagem inteira: build, upload e só então a recusa.
      - name: Resolve o versionCode
        run: |
          fastlane android maior_version_code || true
          MAIOR=$(cat /tmp/maior_version_code.txt 2>/dev/null || echo 0)
          echo "Maior na loja: $MAIOR"
          echo "VERSION_CODE=$((MAIOR + 1))" >> "$GITHUB_ENV"

      - name: Configura o Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" \
            > "$HOME/.bubblewrap/config.json"

      - name: Aplica versão
        working-directory: android
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            m.appVersion = process.env.VERSION_NAME;
            m.appVersionCode = Number(process.env.VERSION_CODE);
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2) + "\n");
            console.log("versão", m.appVersion, "código", m.appVersionCode);
          '
        env:
          VERSION_NAME: ${{ inputs.version_name }}

      - name: Restaura a chave de assinatura
        working-directory: android
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Falta ANDROID_KEYSTORE_BASE64 — sem assinatura a Play recusa."
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Build
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: yes | bubblewrap build --manifest=./twa-manifest.json

      - name: Envia para a Play
        run: |
          fastlane android publicar \
            track:"${{ inputs.track }}" \
            aab:"$GITHUB_WORKSPACE/android/app-release-bundle.aab" \
            dry_run:"${{ inputs.dry_run }}"

      - name: Guarda o pacote enviado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurolab-${{ inputs.version_name }}-${{ inputs.track }}
          path: android/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Apaga a credencial
        if: always()
        run: rm -f "$RUNNER_TEMP/play-credentials.json"
