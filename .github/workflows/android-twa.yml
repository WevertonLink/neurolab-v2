# Gera o pacote Android (TWA) do NeuroLab para a Play Store.
#
# Roda só quando pedido, porque não faz sentido gastar um build de app a cada
# commit de conteúdo: publicar na loja é um ato deliberado, com número de
# versão escolhido.
#
# Por que aqui e não no aparelho: as build-tools do Android SDK não têm build
# oficial para Linux arm64, então o Termux não constrói. O runner é x86_64.
#
# Segredos necessários (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  o arquivo .keystore inteiro em base64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_PASSWORD
# Sem eles o build ainda roda, mas sai sem assinatura e não sobe na loja.

name: Android TWA

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versão visível na loja (ex.: 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Código da versão — inteiro, sempre maior que o anterior'
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  build:
    name: Bubblewrap build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # O Bubblewrap guarda os caminhos do JDK e do SDK num config próprio.
      # Escrevendo o arquivo direto, ele não pergunta nada na primeira execução
      # nem tenta baixar um JDK que já existe aqui.
      - name: Configure Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" \
            > "$HOME/.bubblewrap/config.json"
          bubblewrap doctor

      - name: Aplica a versão pedida
        working-directory: android
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            m.appVersion = process.env.VERSION_NAME;
            m.appVersionCode = Number(process.env.VERSION_CODE);
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2) + "\n");
            console.log("versão:", m.appVersion, "código:", m.appVersionCode);
          '
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}

      - name: Restaura a chave de assinatura
        id: keystore
        working-directory: android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore
            echo "assinado=sim" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64 — saindo sem assinatura."
            echo "assinado=nao" >> "$GITHUB_OUTPUT"
          fi

      # `update` primeiro, por dois motivos. Ele gera o manifest-checksum.txt,
      # e sem esse arquivo o `build` abre uma pergunta interativa. E o
      # --skipVersionUpgrade desarma o incremento automático: sem ele o
      # bubblewrap soma 1 ao appVersionCode e, quando o appVersionName não é
      # igual ao código anterior, para e pergunta um nome novo.
      #
      # A primeira versão deste workflow respondia essas perguntas com `yes |`.
      # O resultado foi um app publicável chamado versão "y", código 2, em vez
      # de 1.0.0 código 1 — e nada falhou para avisar. Responder no escuro é
      # pior que travar: agora, pergunta inesperada quebra o build.
      - name: Build
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          if [ "${{ steps.keystore.outputs.assinado }}" = "sim" ]; then
            bubblewrap build --manifest=./twa-manifest.json
          else
            bubblewrap build --manifest=./twa-manifest.json --skipSigning
          fi

      - name: Confere a versão que saiu
        working-directory: android
        run: |
          ESPERADO_NOME="${{ inputs.version_name }}"
          ESPERADO_CODIGO="${{ inputs.version_code }}"
          SAIU=$(node -e 'const m=require("./twa-manifest.json");console.log(m.appVersion,m.appVersionCode)')
          echo "esperado: $ESPERADO_NOME $ESPERADO_CODIGO | saiu: $SAIU"
          [ "$SAIU" = "$ESPERADO_NOME $ESPERADO_CODIGO" ] || {
            echo "::error::A versão construída não é a pedida."
            exit 1
          }

      - name: Mostra o que saiu
        working-directory: android
        run: ls -la *.aab *.apk 2>/dev/null || echo 'nenhum pacote gerado'

      # O .aab é o que sobe na Play Store; o .apk serve para instalar direto no
      # aparelho e conferir antes de enviar.
      - name: Upload do pacote
        uses: actions/upload-artifact@v7
        with:
          name: neurolab-android-${{ inputs.version_name }}
          path: |
            android/*.aab
            android/*.apk
            android/assetlinks.json
          if-no-files-found: error
          retention-days: 30
